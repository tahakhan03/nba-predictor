<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Brackets — NBA Playoff Predictor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="brackets.css" />
    <link rel="stylesheet" href="leaderboard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>

    <div class="header">
      <div class="header-left">
        <div class="nba-badge">NBA</div>
        <div class="logo">Playoff Predictor</div>
        <div class="made-by">Made by Taha Khan</div>
      </div>
      <nav class="nav">
        <a href="index.html" class="nav-btn">Home</a>
        <a href="brackets.html" class="nav-btn active">View Brackets</a>
        <a href="leaderboard.html" class="nav-btn">Leaderboard</a>
      </nav>
    </div>

    <div class="brackets-outer">

      <div class="page-title-row">
        <div>
          <div class="page-title">All Predictions</div>
          <div class="page-subtitle" id="sub-count">Loading submissions...</div>
        </div>
        <div class="sort-row">
          <label class="sort-label">Sort by</label>
          <select class="sort-select" id="sort-select" onchange="sortSubmissions(this.value)">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
      </div>

      <div id="loading-state" class="loading-state">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading brackets...</div>
      </div>

      <div id="empty-state" class="empty-state" style="display:none">
        <div class="empty-icon">🏀</div>
        <div class="empty-text">No predictions yet</div>
        <a href="index.html" class="empty-cta">Be the first to submit</a>
      </div>

      <div id="cards-grid" class="cards-grid" style="display:none"></div>

    </div>

    <!-- Modal overlay for full bracket view -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div>
            <div class="modal-name" id="modal-name"></div>
            <div class="modal-champ" id="modal-champ"></div>
          </div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script src="brackets.js"></script>
    <script type="module" src="firebase-brackets.js"></script>

  </body>
</html>
