<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA Playoff Predictor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="brackets.css" />
    <link rel="stylesheet" href="leaderboard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>

    <div class="header">
      <div style="display:flex;align-items:center;gap:.6rem">
        <div class="nba-badge">NBA</div>
        <div class="logo">Playoff Predictor</div>
        <div class="made-by">Made by Taha Khan</div>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
        <div style="display:flex;gap:.5rem">
          <a href="index.html" class="nav-btn active">Submit</a>
          <a href="brackets.html" class="nav-btn">View Brackets</a>
          <a href="leaderboard.html" class="nav-btn">Leaderboard</a>
        </div>
        <div class="name-row">
          <label>Name</label>
          <input type="text" id="userName" placeholder="First name + last initial" maxlength="20" />
          <button class="submit-btn" onclick="submitPrediction()">Lock In ↗</button>
        </div>
      </div>
    </div>

    <div class="outer">
      <div class="conf-section">
        <div class="conf-label east-label">Eastern Conference</div>
        <div class="round-cols" id="east-cols"></div>
      </div>

      <div class="finals-center">
        <div class="finals-box">
          <div class="finals-title">NBA Finals</div>
          <div style="font-size:.65rem;color:#6A8FAF;letter-spacing:1px;text-transform:uppercase;margin-top:2px">🏆 Champion Pick</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px">
            <div class="finalist-chip" id="fin-east">East ?</div>
            <div style="font-size:.7rem;color:#6A8FAF">vs</div>
            <div class="finalist-chip" id="fin-west">West ?</div>
          </div>
          <div class="champ-pick-row">
            <button class="champ-btn empty-btn" id="champ-btn-east" onclick="pickChamp('east')">?</button>
            <div style="font-size:.7rem;color:#6A8FAF">wins in</div>
            <select class="champ-games-sel" id="champ-games">
              <option>4</option><option>5</option><option selected>6</option><option>7</option>
            </select>
            <div style="font-size:.7rem;color:#6A8FAF">games</div>
            <button class="champ-btn empty-btn" id="champ-btn-west" onclick="pickChamp('west')">?</button>
          </div>
          <textarea class="finals-reason" id="finals-reason" rows="2" placeholder="Why do they win it all?"></textarea>
        </div>
      </div>

      <div class="conf-section">
        <div class="conf-label west-label">Western Conference</div>
        <div class="round-cols" id="west-cols"></div>
      </div>
    </div>

    <div class="subs-panel">
      <div class="subs-title">Submitted Predictions</div>
      <div id="sub-list">
        <div style="font-size:.8rem;color:#6A8FAF">No predictions yet — be the first!</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ── Games popup modal ── -->
    <div id="games-modal" style="
      display:none;
      position:fixed;
      inset:0;
      background:rgba(5,12,22,0.88);
      z-index:9999;
      align-items:center;
      justify-content:center;
      padding:1rem;
    ">
      <div style="
        background:#0D1B2A;
        border:2px solid #C8A84B;
        border-radius:16px;
        padding:2rem 2rem 1.5rem;
        width:100%;
        max-width:320px;
        font-family:'DM Sans',sans-serif;
      ">
        <div id="games-modal-title" style="
          font-family:'Bebas Neue',sans-serif;
          font-size:1.5rem;
          letter-spacing:2px;
          color:#E8F0F8;
          text-align:center;
          margin-bottom:.25rem;
        ">In how many games?</div>

        <div style="font-size:.72rem;color:#6A8FAF;text-align:center;text-transform:uppercase;letter-spacing:1px;margin-bottom:1.25rem;">
          Select the series score
        </div>

        <ul style="list-style:none;padding:0;margin:0 0 1.25rem;display:flex;flex-direction:column;gap:.5rem;">
          <li>
            <button onclick="confirmGames(0)" style="
              width:100%;background:#132033;border:1px solid #1E3A52;
              border-radius:8px;padding:.7rem 1rem;cursor:pointer;
              display:flex;align-items:center;justify-content:space-between;
              color:#E8F0F8;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;
              letter-spacing:1px;transition:all .15s;
            " onmouseover="this.style.borderColor='#C8A84B';this.style.color='#C8A84B'"
               onmouseout="this.style.borderColor='#1E3A52';this.style.color='#E8F0F8'">
              <span>4-0</span>
              <span style="font-family:'DM Sans',sans-serif;font-size:.72rem;color:#6A8FAF;font-weight:400;">Sweep</span>
            </button>
          </li>
          <li>
            <button onclick="confirmGames(1)" style="
              width:100%;background:#132033;border:1px solid #1E3A52;
              border-radius:8px;padding:.7rem 1rem;cursor:pointer;
              display:flex;align-items:center;justify-content:space-between;
              color:#E8F0F8;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;
              letter-spacing:1px;transition:all .15s;
            " onmouseover="this.style.borderColor='#C8A84B';this.style.color='#C8A84B'"
               onmouseout="this.style.borderColor='#1E3A52';this.style.color='#E8F0F8'">
              <span>4-1</span>
              <span style="font-family:'DM Sans',sans-serif;font-size:.72rem;color:#6A8FAF;font-weight:400;">5 games</span>
            </button>
          </li>
          <li>
            <button onclick="confirmGames(2)" style="
              width:100%;background:#132033;border:1px solid #1E3A52;
              border-radius:8px;padding:.7rem 1rem;cursor:pointer;
              display:flex;align-items:center;justify-content:space-between;
              color:#E8F0F8;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;
              letter-spacing:1px;transition:all .15s;
            " onmouseover="this.style.borderColor='#C8A84B';this.style.color='#C8A84B'"
               onmouseout="this.style.borderColor='#1E3A52';this.style.color='#E8F0F8'">
              <span>4-2</span>
              <span style="font-family:'DM Sans',sans-serif;font-size:.72rem;color:#6A8FAF;font-weight:400;">6 games</span>
            </button>
          </li>
          <li>
            <button onclick="confirmGames(3)" style="
              width:100%;background:#132033;border:1px solid #1E3A52;
              border-radius:8px;padding:.7rem 1rem;cursor:pointer;
              display:flex;align-items:center;justify-content:space-between;
              color:#E8F0F8;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;
              letter-spacing:1px;transition:all .15s;
            " onmouseover="this.style.borderColor='#C8A84B';this.style.color='#C8A84B'"
               onmouseout="this.style.borderColor='#1E3A52';this.style.color='#E8F0F8'">
              <span>4-3</span>
              <span style="font-family:'DM Sans',sans-serif;font-size:.72rem;color:#6A8FAF;font-weight:400;">7 games</span>
            </button>
          </li>
        </ul>

        <button onclick="closeGamesModal()" style="
          width:100%;background:transparent;
          border:1px solid #1E3A52;color:#6A8FAF;
          font-family:'DM Sans',sans-serif;font-size:.8rem;
          padding:8px;border-radius:8px;cursor:pointer;
        ">Cancel</button>
      </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script src="bracket.js"></script>

  </body>
</html>
